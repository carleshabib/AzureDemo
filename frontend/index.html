<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>photo gallery</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 30px auto; padding: 0 15px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 20px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 8px; text-align: center; }
    .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; }
    button { margin-top: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Photo Gallery 📸</h1>
  <input type="file" id="file" accept="image/*">
  <button onclick="upload()">Upload</button>
  <button onclick="uploadDirect()">Direct Upload to blob storage⚡ </button>
  <div class="grid" id="grid"></div>

  <script>
    const API = "https://azure-demo-carles-cje8h3htg7a8eybd.westus3-01.azurewebsites.net";

    async function load() {
      const res = await fetch(`${API}/photos`);
      const photos = await res.json();
      document.getElementById("grid").innerHTML = photos.map(p => `
        <div class="card">
          <img src="${API}/photos/${encodeURIComponent(p.name)}">
          <button onclick="remove('${p.name}')">Delete 🗑️</button>
        </div>`).join("");
    }

    async function upload() {
      const file = document.getElementById("file").files[0];
      if (!file) return alert("اختر صورة");
      const form = new FormData();
      form.append("file", file);
      await fetch(`${API}/photos`, { method: "POST", body: form });
      load();
    }

    async function remove(name) {
      await fetch(`${API}/photos/${encodeURIComponent(name)}`, { method: "DELETE" });
      load();
    }

    load();

    async function uploadDirect() {
  const file = document.getElementById("file").files[0];
  if (!file) return alert("اختر صورة");

  // 1) اطلب رابط الرفع من الـ API
  const res = await fetch(`${API}/photos/upload-url?fileName=${encodeURIComponent(file.name)}`);
  const { uploadUrl } = await res.json();

  // 2) ارفع الملف مباشرة للـ Blob
  await fetch(uploadUrl, {
    method: "PUT",
    headers: { "x-ms-blob-type": "BlockBlob", "Content-Type": file.type },
    body: file
  });

  load();
}

  </script>
</body>
</html>
